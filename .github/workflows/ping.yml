name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Ping App 1
      run: curl -L --max-redirs 5 -A "Mozilla/5.0" https://app1.streamlit.app/ || true
  
    - name: Ping App 2
      run: curl -L --max-redirs 5 -A "Mozilla/5.0" https://app2.streamlit.app/ || true
